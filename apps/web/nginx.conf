server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # API reverse proxy to the api container
  # Resolve `api` via Docker's embedded DNS at request time (not once at nginx
  # startup). When the api container is recreated it gets a new IP; without this,
  # nginx keeps the stale IP and returns 502 Bad Gateway for every API call.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
